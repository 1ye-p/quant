[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "cquant"
version = "0.1.0"
description = "cQuant quantitative research and backtesting platform"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "scipy>=1.13",
    "networkx>=3.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jsonpath-ng>=1.6",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.0",
    "mlflow>=2.14",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "scikit-learn>=1.5",
    "akshare>=1.14",
    "tushare>=1.4",
    "yfinance>=0.2",
    "python-dotenv>=1.0",
    "slowapi>=0.1.9",
    "apscheduler>=3.10",
]
license = { text = "Proprietary" }

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-snapshot>=0.9",
]
qlib = ["qlib>=0.9.0"]

[project.scripts]
cquant = "cquant.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["python/cquant"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
mypy_path = "python"
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q --cov=python/cquant --cov-report=term-missing"
markers = [
    "integration: 端到端集成测试（较慢，使用临时 DuckDB 和合成数据）",
]

[tool.coverage.run]
source = ["python/cquant"]
omit = [
    "python/cquant/*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 60
